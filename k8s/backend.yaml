# 后端（Django + gunicorn）+ 媒体文件持久化卷 + 服务
# 镜像版本号由部署脚本替换 __IMAGE_TAG__（禁止使用 latest）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: online-teach
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: online-teach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/jijia-hui/online-teaching-platform-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-name}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-password}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: db-secret, key: django-secret-key}
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:30080,http://127.0.0.1:30080"
            - name: TZ
              value: Asia/Shanghai
            - name: GUNICORN_WORKERS
              value: "2"
          volumeMounts:
            - name: media
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: online-teach
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

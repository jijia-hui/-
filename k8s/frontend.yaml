# 前端（Nginx 托管静态资源 + 反向代理 /api /media /static 到后端）+ 服务
# 镜像版本号由部署脚本替换 __IMAGE_TAG__（禁止使用 latest）
# Nginx 配置由部署脚本从 web_frontend/nginx.conf 生成 ConfigMap（保持单一来源）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-teach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jijia-hui/online-teaching-platform-frontend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: online-teach
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

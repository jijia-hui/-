# k8s/micro/user-service-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: online-teach-micro        # ← 补充：与 Deployment 同一命名空间
  labels:
    app: user-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service              # HPA 与目标 Deployment 同命名空间（HPA 为命名空间级资源，无需指定 namespace）
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70         # CPU 使用率超过 70% 触发扩容
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # 30 秒内持续高负载才扩容（防止抖动误扩）
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60              # 每 60 秒最多加 2 个 Pod（防止扩容过猛）
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 分钟稳定后才缩容（防止频繁缩容）
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120             # 每 2 分钟最多减 1 个 Pod（平滑缩容）

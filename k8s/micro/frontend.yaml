# 前端（镜像与单体版完全相同：托管静态资源 + 反代 backend:8000 → 网关）
# NodePort 30081（单体版占用 30080，两套可并行部署做性能对比）
# Nginx 配置由部署脚本从 web_frontend/nginx.conf 生成 ConfigMap（保持单一来源）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-teach-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jijia-hui/online-teaching-platform-frontend:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: online-teach-micro
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081

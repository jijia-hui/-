# API 网关（Nginx，不计入业务微服务）
# 配置与 services/gateway/nginx.conf 单一来源：部署脚本用 --from-file 生成 ConfigMap 后应用本文件
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: online-teach-micro
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: gateway-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: gateway-conf
          configMap:
            name: gateway-config
---
# 服务名 backend + 端口 8000：与前端镜像的反代约定一致（前端零改动）
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: online-teach-micro
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000

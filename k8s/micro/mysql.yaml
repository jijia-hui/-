# MySQL 8（官方镜像）+ 持久化卷 + 三库初始化（otp_user / otp_course / otp_assignment）
# 同一实例内库级隔离：物理上杜绝跨服务联表（见《数据表归属方案.md》）
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: online-teach-micro
data:
  01-create-databases.sql: |
    CREATE DATABASE IF NOT EXISTS otp_user CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS otp_course CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS otp_assignment CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    GRANT ALL PRIVILEGES ON otp_user.* TO 'teach_user'@'%';
    GRANT ALL PRIVILEGES ON otp_course.* TO 'teach_user'@'%';
    GRANT ALL PRIVILEGES ON otp_assignment.* TO 'teach_user'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: online-teach-micro
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: online-teach-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_DATABASE
              value: otp_user
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: micro-secret, key: db-user}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: micro-secret, key: db-password}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: micro-secret, key: db-root-password}
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: initdb
          configMap:
            name: mysql-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: online-teach-micro
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

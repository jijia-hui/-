# 用户服务（与 backend 同一镜像，SERVICE_ROLE=user）
# 镜像版本号由部署脚本替换 __IMAGE_TAG__
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: online-teach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/jijia-hui/online-teaching-platform-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-name}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: db-password}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: db-secret, key: django-secret-key}
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:30080,http://127.0.0.1:30080"
            - name: TZ
              value: Asia/Shanghai
            - name: GUNICORN_WORKERS
              value: "2"
            - name: SERVICE_ROLE
              value: "user"
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: online-teach
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000

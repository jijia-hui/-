# API 网关（Nginx）：按 URL 前缀把 /api/* 路由到三个业务微服务。
# - 编排内服务名为 backend、端口 8000（与单体版的 backend 一致，前端镜像零改动）。
# - 上游服务名使用连字符（user-service 等），Compose 与 Kubernetes 通用。
# - 内部接口 /internal/* 一律拒绝，绝不对外暴露。
server {
    listen 8000;
    server_name _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ---- 网关自身健康探活（编排层/部署脚本使用；本地直接返回，不打后端） ----
    location = /api/health/ {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway","probes":{"/api/health/user/":"user-service","/api/health/course/":"course-service","/api/health/assignment/":"assignment-service"}}';
    }

    # ---- 逐服务探活（透传到对应服务的 /api/health/，含版本号与 DB 状态） ----
    location /api/health/user/ {
        proxy_pass http://user-service:8000/api/health/;
    }
    location /api/health/course/ {
        proxy_pass http://course-service:8000/api/health/;
    }
    location /api/health/assignment/ {
        proxy_pass http://assignment-service:8000/api/health/;
    }

    # ---- 业务路由：用户与认证 → user-service ----
    location /api/users/ {
        proxy_pass http://user-service:8000;
    }
    location /api/auth/ {
        proxy_pass http://user-service:8000;
    }

    # ---- 业务路由：课程/选课 → course-service ----
    location /api/courses/ {
        proxy_pass http://course-service:8000;
    }

    # ---- 业务路由：作业/提交/评分 → assignment-service ----
    location /api/assignments/ {
        proxy_pass http://assignment-service:8000;
    }
    location /api/submissions/ {
        proxy_pass http://assignment-service:8000;
    }

    # ---- 管理后台与静态资源（仅 user-service 暴露 Django Admin） ----
    location /admin/ {
        proxy_pass http://user-service:8000;
    }
    location /static/user/ {
        proxy_pass http://user-service:8000;
    }
    location /static/course/ {
        proxy_pass http://course-service:8000;
    }
    location /static/assignment/ {
        proxy_pass http://assignment-service:8000;
    }

    # ---- 参考文档等媒体文件由 assignment-service 存储与提供 ----
    location /media/ {
        proxy_pass http://assignment-service:8000;
    }

    # ---- 内部接口绝不经网关暴露 ----
    location /internal/ {
        default_type application/json;
        return 403 '{"detail":"internal endpoints are not exposed through the gateway"}';
    }

    # 网关只服务 API；其余路径返回 404（页面由前端容器提供）
    location / {
        default_type application/json;
        return 404 '{"detail":"not found (API gateway)"}';
    }
}

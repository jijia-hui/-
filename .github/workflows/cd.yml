# 在线教学与实训平台 - CD 流水线
# 触发：推送到 main（版本号为提交 SHA）或推送 v* 标签（版本号为标签名，如 v1.0.0）
# 全链路：测试 → 制作版本化镜像并推送 GHCR → 部署到 Kubernetes（kind）→ 健康检查
# 任何一步失败即停止，后续部署不会继续；日志与失败诊断均保留为构建产物。
name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/online-teaching-platform-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/online-teaching-platform-frontend
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

jobs:
  test:
    name: 测试（单元 + 集成 + E2E）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: online_teach
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: online_teach
      DB_USER: root
      DB_PASSWORD: root123
      DJANGO_SECRET_KEY: ci-secret-key
      PYTHONPATH: web_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r web_backend/requirements.txt
      - name: 单元测试 + 集成/API 测试
        run: python web_backend/manage.py test 04_tests/unit 04_tests/integration
      - name: 迁移数据库（E2E 需要真实库）
        run: python web_backend/manage.py migrate
      - name: 端到端测试（E2E-TC01~14）
        run: python 04_tests/e2e/run_e2e.py
      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-e2e-report
          path: 04_tests/reports/e2e_report_*.md
          if-no-files-found: ignore

  build-and-push:
    name: 构建并推送镜像（版本见步骤日志）
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web_backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.VERSION }}
            ${{ env.IMAGE_BACKEND }}:latest
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web_frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}
            ${{ env.IMAGE_FRONTEND }}:latest

  deploy-k8s:
    name: 部署到 Kubernetes 并健康检查（kind）
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 创建 kind 集群
        uses: helm/kind-action@v1
        with:
          # kind load 默认连接名为 kind 的集群，而 kind-action 默认集群名是 chart-testing
          cluster_name: kind

      - uses: azure/setup-kubectl@v4

      - name: 本地构建版本化镜像
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ env.VERSION }} ./web_backend
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }} ./web_frontend

      - name: 导入镜像到 kind 集群
        run: |
          kind load docker-image ${{ env.IMAGE_BACKEND }}:${{ env.VERSION }}
          kind load docker-image ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}

      - name: 部署并健康检查
        run: bash scripts/deploy_k8s.sh ${{ env.VERSION }} | tee deploy_k8s.log
        shell: bash

      - name: 失败诊断（记录失败原因）
        if: failure()
        run: |
          kubectl -n online-teach get pods -o wide || true
          kubectl -n online-teach describe deploy/backend deploy/frontend || true
          kubectl -n online-teach logs -l app=backend --tail=150 || true
          kubectl -n online-teach logs -l app=frontend --tail=150 || true
        shell: bash

      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-deploy-log
          path: deploy_k8s.log
          if-no-files-found: ignore

  deploy-production:
    name: 部署到生产集群
    needs: [build-and-push, deploy-k8s]
    # 仅打 tag 时执行；未配置 KUBE_CONFIG 密钥时跳过具体步骤
    # 注意：job 级 if 无法访问 secrets（GitHub 限制），故在步骤内检查
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: 检查 KUBE_CONFIG 密钥
        id: check-kube
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 写入 kubeconfig
        if: steps.check-kube.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo '${{ secrets.KUBE_CONFIG }}' | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: 部署并健康检查
        if: steps.check-kube.outputs.configured == 'true'
        run: bash scripts/deploy_k8s.sh ${{ env.VERSION }}
        shell: bash
      - name: 未配置 KUBE_CONFIG，跳过生产集群部署
        if: steps.check-kube.outputs.configured != 'true'
        run: echo "未配置 KUBE_CONFIG 密钥，跳过生产集群部署"

  deploy-ssh:
    name: 部署到服务器（docker compose）
    needs: [build-and-push, deploy-k8s]
    # 仅打 tag 时执行；未配置 SERVER_HOST 密钥时跳过具体步骤
    # 注意：job 级 if 无法访问 secrets（GitHub 限制），故在步骤内检查
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 SERVER_HOST 密钥
        id: check-ssh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH 拉取代码并重启容器
        if: steps.check-ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR || '~/online_teaching_platform' }}
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            docker compose up -d --build
            docker compose ps
      - name: 未配置 SERVER_HOST，跳过服务器部署
        if: steps.check-ssh.outputs.configured != 'true'
        run: echo "未配置 SERVER_HOST 密钥，跳过服务器部署"

# 在线教学与实训平台 - CD 流水线
# 触发：推送 v* 标签（如 v1.0.0）或手动运行
# 内容：
#   1. 构建并推送前后端镜像到 GHCR（ghcr.io/<用户名>/online-teaching-platform-*，无需额外密钥）
#   2. 若配置了服务器 SSH 密钥，自动 SSH 到服务器拉代码并 docker compose up
name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/online-teaching-platform-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/online-teaching-platform-frontend

jobs:
  build-and-push:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web_backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web_frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
            ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    name: 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    # 未配置 SERVER_HOST 密钥时跳过部署（镜像仍会推送到 GHCR）
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH 拉取代码并重启容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR || '~/online_teaching_platform' }}
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            docker compose up -d --build
            docker compose ps

# 微服务版 CD 流水线：代码提交后，相关微服务自动完成 构建 → 测试 → 制作镜像 → 部署 Kubernetes → E2E 回归
# 触发：推送到 main（版本号=提交 SHA）或推送 v* 标签（版本号=标签名；标签视为全部服务变更）
# 任何一步失败即停止，后续部署不会执行；部署日志与 E2E 报告保留为构建产物。
name: CD-Micro

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-micro-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/otp
  # 前端镜像沿用单体版镜像名（K8s 清单单一来源）
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/online-teaching-platform-frontend
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

jobs:
  changes:
    name: 检测变更的微服务
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      course: ${{ steps.filter.outputs.course }}
      assignment: ${{ steps.filter.outputs.assignment }}
      gateway: ${{ steps.filter.outputs.gateway }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "--- 变更文件（节选） ---"; echo "$CHANGED" | head -50
          has() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          USER=$(has '^services/user_service/')
          COURSE=$(has '^services/course_service/')
          ASSIGN=$(has '^services/assignment_service/')
          GATEWAY=$(has '^services/gateway/')
          # 编排/部署/流水线变更 → 全部服务重新部署（不重建镜像，用 latest）
          INFRA=$(has '^(docker-compose\.micro|k8s/micro/|scripts/deploy_micro_k8s\.sh|\.github/workflows/cd-micro)')
          ANY=$([ "$USER" = true ] || [ "$COURSE" = true ] || [ "$ASSIGN" = true ] || [ "$GATEWAY" = true ] || [ "$INFRA" = true ] && echo true || echo false)
          # 手动运行或打标签 → 全部服务视为变更
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            USER=true; COURSE=true; ASSIGN=true; GATEWAY=true; ANY=true
          fi
          {
            echo "user=$USER"
            echo "course=$COURSE"
            echo "assignment=$ASSIGN"
            echo "gateway=$GATEWAY"
            echo "any=$ANY"
          } >> "$GITHUB_OUTPUT"

  test:
    name: 微服务测试（单元 + API，SQLite）
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user
            dir: services/user_service
            enabled: ${{ needs.changes.outputs.user }}
          - service: course
            dir: services/course_service
            enabled: ${{ needs.changes.outputs.course }}
          - service: assignment
            dir: services/assignment_service
            enabled: ${{ needs.changes.outputs.assignment }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.enabled == 'true'
      - uses: actions/setup-python@v5
        if: matrix.enabled == 'true'
        with:
          python-version: '3.12'
      - name: 安装依赖
        if: matrix.enabled == 'true'
        run: pip install -r ${{ matrix.dir }}/requirements.txt
      - name: 单元 + API 测试
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          USE_SQLITE: '1'
        run: python manage.py test tests -v 1

  build-and-push:
    name: 构建并推送镜像（仅变更服务）
    needs: [changes, test]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            dir: services/user_service
            enabled: ${{ needs.changes.outputs.user }}
          - service: course-service
            dir: services/course_service
            enabled: ${{ needs.changes.outputs.course }}
          - service: assignment-service
            dir: services/assignment_service
            enabled: ${{ needs.changes.outputs.assignment }}
          - service: gateway
            dir: services/gateway
            enabled: ${{ needs.changes.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.enabled == 'true'
      - uses: docker/setup-buildx-action@v3
        if: matrix.enabled == 'true'
      - uses: docker/login-action@v3
        if: matrix.enabled == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 ${{ matrix.service }}（版本 ${{ env.VERSION }}）
        if: matrix.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy-k8s:
    name: 部署微服务到 Kubernetes 并做 E2E 回归（kind）
    needs: [changes, build-and-push]
    if: |
      always() && needs.changes.outputs.any == 'true' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 创建 kind 集群
        uses: helm/kind-action@v1
        with:
          # kind load 默认连接名为 kind 的集群，而 kind-action 默认集群名是 chart-testing
          cluster_name: kind

      - uses: azure/setup-kubectl@v4

      - name: 本地构建镜像（与已推送镜像同源同版本；kind 环境直接加载，不依赖镜像仓库权限）
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-user-service:${{ env.VERSION }} ./services/user_service
          docker build -t ${{ env.IMAGE_PREFIX }}-course-service:${{ env.VERSION }} ./services/course_service
          docker build -t ${{ env.IMAGE_PREFIX }}-assignment-service:${{ env.VERSION }} ./services/assignment_service
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }} ./web_frontend

      - name: 导入镜像到 kind 集群
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}-user-service:${{ env.VERSION }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}-course-service:${{ env.VERSION }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}-assignment-service:${{ env.VERSION }}
          kind load docker-image ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}

      - name: 部署并健康检查（统一以本版本部署；kind 集群镜像已本地加载，不依赖仓库可见性。
           变更检测作用于上游的测试与镜像推送：只有变更过的服务才会重新测试/推送到 GHCR）
        run: |
          bash scripts/deploy_micro_k8s.sh \
            user=${{ env.VERSION }} \
            course=${{ env.VERSION }} \
            assignment=${{ env.VERSION }} \
            frontend=${{ env.VERSION }} | tee deploy_micro_k8s.log
        shell: bash

      - name: 端到端回归（E2E-TC01~14 + 级联清理，经网关）
        run: |
          pip install requests
          E2E_BASE_URL=http://127.0.0.1:8080 \
          E2E_EXEC_PREFIX="kubectl -n online-teach-micro exec deploy/user-service --" \
          python 04_tests/e2e/run_e2e_micro.py | tee e2e_micro.log
        shell: bash

      - name: 失败诊断（记录失败原因）
        if: failure()
        run: |
          kubectl -n online-teach-micro get pods -o wide || true
          kubectl -n online-teach-micro describe deploy/user-service deploy/course-service deploy/assignment-service deploy/gateway || true
          for d in user-service course-service assignment-service gateway; do
            echo "===== logs deploy/$d ====="
            kubectl -n online-teach-micro logs deploy/$d --tail=100 || true
          done
        shell: bash

      - name: 上传部署日志与 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-deploy-artifacts
          path: |
            deploy_micro_k8s.log
            e2e_micro.log
            04_tests/reports/e2e_micro_report_*.md
          if-no-files-found: ignore
